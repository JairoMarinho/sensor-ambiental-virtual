[project]
name = "sensor-ambiental-virtual"
version = "0.3.0"
description = "Sistema IoT com ESP32, DHT11, MQTT e dashboard para monitoramento ambiental."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Jairo Marinho" }]
dependencies = ["paho-mqtt>=2.1,<3"]

[project.scripts]
sensor-virtual = "src.sensor_virtual.cli:main"
sensor-mqtt-publisher = "src.mqtt.publisher:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
